<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soketi Chat Test</title>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .server-info {
            margin: 20px 30px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 8px;
            font-size: 14px;
            color: #1976d2;
            border-left: 4px solid #2196f3;
        }
        .status {
            padding: 12px 20px;
            margin: 20px 30px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
        }
        .status.connected { background: #d4edda; color: #155724; border: 2px solid #28a745; }
        .status.disconnected { background: #f8d7da; color: #721c24; border: 2px solid #dc3545; }
        .status.connecting { background: #fff3cd; color: #856404; border: 2px solid #ffc107; }
        .input-section {
            padding: 20px 30px;
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .input-section input {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .messages-section { padding: 20px 30px; }
        .messages-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        #messages {
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }
        .message {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .my-message {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        .debug-section { background: #f8f9fa; padding: 20px 30px; }
        #debugLog {
            background: #2d3748;
            color: #48bb78;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🚀 Soketi Chat Test</h1>
        </div>

        <div class="server-info" id="serverInfo"></div>
        <div id="status" class="status connecting">⏳ Connecting to Soketi...</div>

        <div class="input-section">
            <input type="text" id="messageInput" placeholder="Type your message..." disabled />
            <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </div>

        <div class="messages-section">
            <div class="messages-header">
                <h3>Messages</h3>
                <span id="messageCount">0</span>
            </div>
            <div id="messages">
                <div class="no-messages">💬 No messages yet.</div>
            </div>
        </div>

        <div class="debug-section">
            <h3>Debug Log</h3>
            <div id="debugLog"></div>
        </div>
    </div>

<script>
/* ----------------------------
   PRODUCTION HTTPS / WSS CONFIG
----------------------------- */

const APP_KEY = "KEY-test";

const CONFIG = {
    wsHost: "soketi-chat-server-production.up.railway.app",
    wsPort: 443,
    wssPort: 443,
    forceTLS: true,
    encrypted: true,
    enabledTransports: ["ws", "wss"],
    environment: "Production (HTTPS/WSS)"
};

document.getElementById("serverInfo").innerHTML = `
    📡 <strong>${CONFIG.environment}</strong><br>
    WebSocket: wss://${CONFIG.wsHost}:443<br>
    App Key: ${APP_KEY}
`;

function debug(msg) {
    const log = document.getElementById("debugLog");
    log.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + log.innerHTML;
    console.log(msg);
}

let messageCounter = 0;
let userId = "User-" + Math.floor(Math.random() * 9999);
let pusher = null;
let channel = null;

/* ----------------------------
   Initialize Secure Pusher Client
----------------------------- */

function initializePusher() {
    debug("Initializing Pusher over WSS...");

    pusher = new Pusher(APP_KEY, {
        wsHost: CONFIG.wsHost,
        wsPort: CONFIG.wsPort,
        wssPort: CONFIG.wssPort,
        forceTLS: true,
        encrypted: true,
        disableStats: true,
        enabledTransports: ["ws", "wss"],
        cluster: "mt1"
    });

    channel = pusher.subscribe("test-channel");

    pusher.connection.bind("connected", () => {
        debug("✅ Connected to Soketi!");
        document.getElementById("status").className = "status connected";
        document.getElementById("status").innerHTML = "Connected ✔️";

        document.getElementById("messageInput").disabled = false;
        document.getElementById("sendBtn").disabled = false;
    });

    pusher.connection.bind("error", err => {
        debug("❌ Error: " + JSON.stringify(err));
    });

    channel.bind("client-new-message", data => {
        if (data.sender !== userId) {
            displayMessage(data.text, data.timestamp, data.sender);
        }
    });
}

function sendMessage() {
    const input = document.getElementById("messageInput");
    let text = input.value.trim();
    if (!text) return;

    let message = {
        text: text,
        timestamp: new Date().toISOString(),
        sender: userId
    };

    channel.trigger("client-new-message", message);

    displayMessage(text, message.timestamp, userId);

    input.value = "";
}

function displayMessage(text, timestamp, sender) {
    const container = document.getElementById("messages");

    if (messageCounter === 0) {
        container.innerHTML = "";
    }

    let div = document.createElement("div");
    div.className = sender === userId ? "message my-message" : "message";

    div.innerHTML = `
        <strong>${sender === userId ? "You" : sender}</strong>
        <div>${text}</div>
        <small>${new Date(timestamp).toLocaleTimeString()}</small>
    `;

    container.prepend(div);
    messageCounter++;
    document.getElementById("messageCount").innerText = messageCounter;
}

window.addEventListener("DOMContentLoaded", initializePusher);
</script>
</body>
</html>
