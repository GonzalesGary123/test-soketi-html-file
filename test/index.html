<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soketi Chat Test</title>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }

        .server-info {
            margin: 20px 30px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 8px;
            font-size: 14px;
            color: #1976d2;
            border-left: 4px solid #2196f3;
        }

        .server-info strong {
            display: block;
            margin-bottom: 5px;
        }
        
        .status {
            padding: 12px 20px;
            margin: 20px 30px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .status.connecting {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        
        .input-section {
            padding: 20px 30px;
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .input-section input {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        
        .input-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-section input:disabled {
            background: #f0f0f0;
            cursor: not-allowed;
        }
        
        .input-section button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .input-section button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .input-section button:active:not(:disabled) {
            transform: translateY(0);
        }

        .input-section button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .messages-section {
            padding: 20px 30px;
        }
        
        .messages-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .messages-header h3 {
            color: #333;
        }
        
        .message-count {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        #messages {
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .no-messages {
            text-align: center;
            color: #999;
            padding: 60px 20px;
            font-size: 16px;
        }
        
        .message {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.my-message {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-left: 4px solid #2196f3;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message .meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #666;
        }
        
        .message .sender {
            font-weight: bold;
            color: #667eea;
        }

        .message.my-message .sender {
            color: #2196f3;
        }
        
        .message .time {
            color: #999;
        }
        
        .message .text {
            color: #333;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .debug-section {
            background: #f8f9fa;
            padding: 20px 30px;
            border-top: 2px solid #e9ecef;
        }
        
        .debug-section h3 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .debug-controls {
            display: flex;
            gap: 10px;
        }

        .debug-controls button {
            padding: 5px 10px;
            font-size: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .debug-controls button:hover {
            background: #5568d3;
        }
        
        #debugLog {
            background: #2d3748;
            color: #48bb78;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.6;
        }
        
        #debugLog .error {
            color: #fc8181;
        }
        
        #debugLog .success {
            color: #48bb78;
        }
        
        #debugLog .info {
            color: #63b3ed;
        }

        #debugLog .warning {
            color: #f6ad55;
        }
        
        #messages::-webkit-scrollbar,
        #debugLog::-webkit-scrollbar {
            width: 8px;
        }
        
        #messages::-webkit-scrollbar-track,
        #debugLog::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        #messages::-webkit-scrollbar-thumb,
        #debugLog::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Soketi Chat Test</h1>
            <p>Real-time messaging powered by Soketi</p>
        </div>

        <div class="server-info" id="serverInfo">
            📡 <strong>Connecting to server...</strong>
        </div>
        
        <div id="status" class="status connecting">
            ⏳ Connecting to Soketi...
        </div>

        <div class="input-section">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Type your message here..." 
                autocomplete="off"
                disabled
            />
            <button onclick="sendMessage()" id="sendBtn" disabled>Send</button>
        </div>

        <div class="messages-section">
            <div class="messages-header">
                <h3>Messages</h3>
                <span class="message-count" id="messageCount">0</span>
            </div>
            <div id="messages">
                <div class="no-messages">
                    💬 No messages yet. Start the conversation!
                </div>
            </div>
        </div>

        <div class="debug-section">
            <h3>
                🔧 Debug Log
                <div class="debug-controls">
                    <button onclick="clearDebugLog()">Clear</button>
                    <button onclick="toggleDebugLog()">Toggle</button>
                </div>
            </h3>
            <div id="debugLog"></div>
        </div>
    </div>

    <script>
        // CONFIGURATION - Based on your Railway setup
        
        // Your Railway TCP Proxy settings (from the screenshot)
        const TCP_PROXY_HOST = 'turntable.proxy.rlwy.net';
        const TCP_PROXY_PORT = 16943;
        const INTERNAL_PORT = 9601; // This is your Soketi internal port
        
        // Your Soketi App Key (must match SOKETI_DEFAULT_APP_KEY in Railway)
        const APP_KEY = 'KEY-test';
        
        // Use TCP Proxy configuration
        const CONFIG = {
            wsHost: TCP_PROXY_HOST,
            wsPort: TCP_PROXY_PORT,
            forceTLS: false,
            encrypted: false,
            enabledTransports: ['ws'],
            environment: 'Production (TCP Proxy)'
        };

        let messageCounter = 0;
        let pusher = null;
        let channel = null;
        const userId = 'User-' + Math.floor(Math.random() * 10000);

        document.getElementById('serverInfo').innerHTML = `
            📡 <strong>${CONFIG.environment}</strong><br>
            WebSocket: ${CONFIG.forceTLS ? 'wss' : 'ws'}://${CONFIG.wsHost}:${CONFIG.wsPort}<br>
            App Key: ${APP_KEY}
        `;

        function debugLog(message, type = 'info') {
            console.log(message);
            const debugDiv = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            const className = type;
            debugDiv.innerHTML = `<span class="${className}">[${time}] ${message}</span><br>` + debugDiv.innerHTML;
        }

        function clearDebugLog() {
            document.getElementById('debugLog').innerHTML = '';
            debugLog('Debug log cleared', 'info');
        }

        function toggleDebugLog() {
            const debugLogDiv = document.getElementById('debugLog');
            debugLogDiv.style.display = debugLogDiv.style.display === 'none' ? 'block' : 'none';
        }

        function initializePusher() {
            debugLog(`🔧 Initializing Pusher in ${CONFIG.environment} mode...`, 'info');
            debugLog(`📡 Connecting to: ${CONFIG.wsHost}:${CONFIG.wsPort}`, 'info');
            debugLog(`🔒 TLS: ${CONFIG.forceTLS}`, 'info');

            pusher = new Pusher(APP_KEY, {
                wsHost: CONFIG.wsHost,
                wsPort: CONFIG.wsPort,
                wssPort: CONFIG.wsPort,
                forceTLS: CONFIG.forceTLS,
                encrypted: CONFIG.encrypted,
                disableStats: true,
                enabledTransports: CONFIG.enabledTransports,
                cluster: 'mt1',
                activityTimeout: 30000,
                pongTimeout: 10000
            });

            // Subscribe to channel with client events enabled
            channel = pusher.subscribe('test-channel');

            pusher.connection.bind('state_change', (states) => {
                debugLog(`📶 State: ${states.previous} → ${states.current}`, 'info');
            });

            pusher.connection.bind('connected', () => {
                document.getElementById('status').className = 'status connected';
                document.getElementById('status').innerHTML = '✅ Connected to Soketi!';
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                debugLog('✅ Connected successfully! Socket ID: ' + pusher.connection.socket_id, 'success');
            });

            pusher.connection.bind('disconnected', () => {
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').innerHTML = '❌ Disconnected from Soketi';
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                debugLog('❌ Disconnected from Soketi', 'error');
            });

            pusher.connection.bind('error', (err) => {
                debugLog('❌ Connection error: ' + JSON.stringify(err), 'error');
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').innerHTML = '❌ Connection Error - Check debug log';
                
                if (err.error) {
                    debugLog(`❌ Error details: ${err.error.data?.message || err.error.toString()}`, 'error');
                }
            });

            pusher.connection.bind('unavailable', () => {
                debugLog('⚠️ Connection unavailable, will retry...', 'warning');
            });

            channel.bind('pusher:subscription_succeeded', () => {
                debugLog('✅ Subscribed to test-channel', 'success');
            });

            channel.bind('pusher:subscription_error', (err) => {
                debugLog('❌ Subscription error: ' + JSON.stringify(err), 'error');
            });

            // Listen for messages from other users
            channel.bind('client-new-message', (data) => {
                debugLog(`📨 Received message from: ${data.sender}`, 'success');
                if (data.sender !== userId) {
                    displayMessage(data.text, data.timestamp, data.sender);
                }
            });
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) {
                debugLog('⚠️ Cannot send empty message', 'warning');
                return;
            }

            const messageData = {
                text: message,
                timestamp: new Date().toISOString(),
                sender: userId
            };
            
            debugLog(`📤 Sending message via client event...`, 'info');
            
            try {
                // Trigger client event (requires client events to be enabled on Soketi)
                channel.trigger('client-new-message', messageData);
                
                debugLog('✅ Message sent successfully!', 'success');
                input.value = '';
                
                // Display immediately for sender
                displayMessage(messageData.text, messageData.timestamp, messageData.sender);
                
            } catch (error) {
                debugLog('❌ Error: ' + error.message, 'error');
                alert(`Error sending message: ${error.message}\n\nMake sure client events are enabled in Soketi configuration!`);
            }
        }

        function displayMessage(text, timestamp, sender) {
            const messagesDiv = document.getElementById('messages');
            
            if (messageCounter === 0) {
                messagesDiv.innerHTML = '';
            }
            
            const messageDiv = document.createElement('div');
            const isMe = sender === userId;
            messageDiv.className = isMe ? 'message my-message' : 'message';
            
            const time = new Date(timestamp).toLocaleTimeString();
            
            messageDiv.innerHTML = `
                <div class="meta">
                    <span class="sender">${isMe ? '👤 You' : '👥 ' + sender}</span>
                    <span class="time">${time}</span>
                </div>
                <div class="text">${escapeHtml(text)}</div>
            `;
            
            messagesDiv.insertBefore(messageDiv, messagesDiv.firstChild);
            
            messageCounter++;
            document.getElementById('messageCount').textContent = messageCounter;
            
            debugLog('✅ Message displayed in UI', 'success');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            debugLog('🎬 Page loaded, initializing...', 'info');
            initializePusher();
        });

        window.addEventListener('beforeunload', () => {
            if (pusher) {
                pusher.disconnect();
            }
        });
    </script>
</body>
</html>
